name: Check Pokemon restock/listing alerts

on:
  schedule:
    # This is a SAFETY NET, not the main driver of check frequency. Each
    # shard job loops internally on its own runner (see the "Run checks
    # continuously" step below) for up to ~5h40m per run, since GitHub
    # hard-caps any single job at 6 hours. This cron just makes sure a
    # fresh run starts within 30 min if a shard's long-running job ever
    # dies early (crash, runner issue, etc). Thanks to the per-shard
    # concurrency group below, extra triggers while a shard is already
    # looping just queue harmlessly instead of starting a duplicate.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" in the Actions tab to test on demand

permissions:
  contents: write   # needed so each shard can commit its own state file back

jobs:
  check:
    strategy:
      fail-fast: false   # one shard failing shouldn't cancel the other five
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Six shards run as six separate jobs on six separate runners at the
    # same time - each one only checks its own slice of retailers
    # (config/shard-N.json), so each shard's own cycle is much faster
    # than one job checking all 40+ watches serially/semi-concurrently.
    concurrency:
      group: check-stock-shard-${{ matrix.shard }}
      cancel-in-progress: false   # never cancel a run mid-check, just queue the next one for THIS shard
    runs-on: ubuntu-latest
    timeout-minutes: 355   # just under GitHub's 6-hour (360 min) hard cap per job; the loop step below stops itself well before this
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (+ OS deps)
        run: python -m playwright install --with-deps chromium
        # Playwright's own cache check means this is fast even when the
        # actions/cache step above already restored the browser binary.

      - name: Run checks continuously for this shard
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHARD: ${{ matrix.shard }}
        run: |
          git config user.name "restock-alert-bot"
          git config user.email "actions@users.noreply.github.com"

          CONFIG_FILE="config/shard-${SHARD}.json"
          STATE_FILE="state/shard-${SHARD}.json"

          # Loop for ~5h40m, then let this run end so the schedule above
          # can start a fresh one for this shard (GitHub kills any job at
          # the 6h mark regardless, so this run stops itself well before
          # that).
          END_TIME=$(( $(date +%s) + 340 * 60 ))
          CYCLE=0

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            CYCLE=$((CYCLE + 1))
            echo "=== Shard $SHARD, cycle $CYCLE: $(date -u +%H:%M:%S) UTC ==="

            python check_stock.py --config "$CONFIG_FILE" --state "$STATE_FILE"

            if ! git diff --quiet -- "$STATE_FILE"; then
              git add "$STATE_FILE"
              git commit -m "Update alert state for shard $SHARD [skip ci]"
              # Pull-rebase-retry in case another shard's job pushed a
              # commit (to a different file) in between. Since each shard
              # only ever touches its own state file, this always applies
              # cleanly - it's just catching up on a moved HEAD.
              git push || (git pull --rebase --autostash && git push)
            fi

            # Each cycle only checks ~7 URLs for this shard (vs 40+ before
            # sharding), so a cycle finishes in well under a minute; this
            # sleep just adds a small gap so we're not hammering the same
            # handful of sites back-to-back with zero pause.
            sleep 15
          done

          echo "Loop window elapsed for shard $SHARD - the next scheduled run will pick up where this left off."
